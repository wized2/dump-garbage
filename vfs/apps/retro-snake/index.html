<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Snake</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #22c55e;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    #score-bar {
      width: 400px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
    }
    canvas {
      border: 2px solid #22c55e;
      background: #051008;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
    }
    #game-over {
      margin-top: 10px;
      font-size: 14px;
      color: #ef4444;
      display: none;
    }
    .btn {
      background: #22c55e;
      color: #000;
      border: none;
      padding: 6px 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="score-bar">
    <span>SCORE: <span id="score">0</span></span>
    <span>HIGH: <span id="high">0</span></span>
  </div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="game-over">GAME OVER! <button class="btn" onclick="restart()">Restart (Space)</button></div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    let count = 0;
    let score = 0;
    let high = 0;
    let running = true;

    let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [], maxCells: 4 };
    let apple = { x: 320, y: 320 };

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function restart() {
      score = 0;
      document.getElementById('score').innerText = score;
      document.getElementById('game-over').style.display = 'none';
      snake.x = 160;
      snake.y = 160;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = grid;
      snake.dy = 0;
      running = true;
    }

    function loop() {
      requestAnimationFrame(loop);
      if (!running) return;

      if (++count < 6) return;
      count = 0;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      snake.x += snake.dx;
      snake.y += snake.dy;

      // Wrap edges
      if (snake.x < 0) snake.x = canvas.width - grid;
      else if (snake.x >= canvas.width) snake.x = 0;
      if (snake.y < 0) snake.y = canvas.height - grid;
      else if (snake.y >= canvas.height) snake.y = 0;

      snake.cells.unshift({ x: snake.x, y: snake.y });
      if (snake.cells.length > snake.maxCells) snake.cells.pop();

      // Draw Apple
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      // Draw Snake
      ctx.fillStyle = '#22c55e';
      snake.cells.forEach((cell, index) => {
        ctx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        // Ate apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          if (score > high) high = score;
          document.getElementById('score').innerText = score;
          document.getElementById('high').innerText = high;
          apple.x = getRandomInt(0, 20) * grid;
          apple.y = getRandomInt(0, 20) * grid;
        }

        // Collision with body
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            running = false;
            document.getElementById('game-over').style.display = 'block';
          }
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
      else if (e.key === 'ArrowUp' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
      else if (e.key === 'ArrowRight' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
      else if (e.key === 'ArrowDown' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
      else if (e.code === 'Space' && !running) { restart(); }
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
