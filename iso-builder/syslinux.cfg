DEFAULT endroid
PROMPT 0
TIMEOUT 30

UI menu.c32
MENU TITLE Endroid OS Boot Menu

LABEL endroid
    MENU LABEL Start Endroid OS (Graphical Desktop)
    LINUX /boot/vmlinuz
    INITRD /boot/initrd.img
    APPEND quiet splash rw root=/dev/ram0 video=1920x1080

LABEL failsafe
    MENU LABEL Start Endroid OS (Failsafe Safe Graphics)
    LINUX /boot/vmlinuz
    INITRD /boot/initrd.img
    APPEND nomodeset xforcevesa rw root=/dev/ram0
